<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30秒口算打地鼠</title>
  <style>
    :root {
      --bg1: #f7efe1;
      --bg2: #d8efd9;
      --panel: rgba(255, 255, 255, 0.86);
      --ink: #1f3a2e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,0.8), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(255,255,255,0.55), transparent 38%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(980px, 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid rgba(0, 0, 0, 0.07);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef7ed;
      border: 1px solid rgba(31, 58, 46, 0.15);
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: linear-gradient(180deg, #dbf0ff 0%, #d7f2c9 62%, #9dd37f 63%, #8ec772 100%);
    }

    #stage {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <div class="pill" id="timeText">剩余: 30.0s</div>
      <div class="pill" id="correctText">答对: 0</div>
      <div class="pill" id="streakText">连对: 0</div>
      <div class="pill" id="maxStreakText">最高连对: 0</div>
      <div class="pill" id="scoreHintText">当前分: 0</div>
    </div>
    <div class="canvas-wrap" id="stage"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script>
    const GAME_SECONDS = 30;
    const ROUND_SECONDS = 2.2;
    const MOLE_COUNT = 6;

    const hud = {
      time: document.getElementById("timeText"),
      correct: document.getElementById("correctText"),
      streak: document.getElementById("streakText"),
      maxStreak: document.getElementById("maxStreakText"),
      scoreHint: document.getElementById("scoreHintText")
    };

    const stageWrap = document.getElementById("stage");
    const app = new PIXI.Application({
      resizeTo: stageWrap,
      antialias: true,
      backgroundAlpha: 0
    });
    stageWrap.appendChild(app.view);

    const state = {
      started: false,
      ended: false,
      gameLeft: GAME_SECONDS,
      roundLeft: ROUND_SECONDS,
      currentQ: null,
      queue: [],
      totalAnswered: 0,
      correctCount: 0,
      streak: 0,
      maxStreak: 0,
      locked: false
    };

    const root = new PIXI.Container();
    app.stage.addChild(root);

    const questionRow = new PIXI.Container();
    root.addChild(questionRow);

    const feedbackText = new PIXI.Text("", {
      fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
      fontSize: 34,
      fill: 0xffffff,
      fontWeight: "800",
      stroke: 0x2f5d3e,
      strokeThickness: 5,
      dropShadow: true,
      dropShadowColor: 0x000000,
      dropShadowBlur: 2,
      dropShadowDistance: 2
    });
    feedbackText.anchor.set(0.5);
    feedbackText.alpha = 0;
    root.addChild(feedbackText);

    const board = new PIXI.Container();
    root.addChild(board);

    const overlay = new PIXI.Container();
    root.addChild(overlay);

    const overlayBg = new PIXI.Graphics();
    overlay.addChild(overlayBg);

    const overlayTitle = new PIXI.Text("", {
      fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
      fontSize: 56,
      fill: 0xffffff,
      fontWeight: "900"
    });
    overlayTitle.anchor.set(0.5);
    overlay.addChild(overlayTitle);

    const overlayInfo = new PIXI.Text("", {
      fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
      fontSize: 30,
      fill: 0xffffff,
      align: "center",
      lineHeight: 44
    });
    overlayInfo.anchor.set(0.5);
    overlay.addChild(overlayInfo);

    const startBtn = new PIXI.Container();
    startBtn.eventMode = "static";
    startBtn.cursor = "pointer";
    overlay.addChild(startBtn);

    const startBtnBg = new PIXI.Graphics();
    startBtn.addChild(startBtnBg);

    const startBtnText = new PIXI.Text("开始挑战", {
      fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
      fontSize: 28,
      fill: 0xffffff,
      fontWeight: "900"
    });
    startBtnText.anchor.set(0.5);
    startBtn.addChild(startBtnText);

    const moles = [];

    function makeMole() {
      const c = new PIXI.Container();
      c.eventMode = "static";
      c.cursor = "pointer";

      const hole = new PIXI.Graphics();
      c.addChild(hole);

      const headWrap = new PIXI.Container();
      c.addChild(headWrap);

      const head = new PIXI.Graphics();
      headWrap.addChild(head);

      const num = new PIXI.Text("0", {
        fontFamily: "Arial Black, Microsoft YaHei, sans-serif",
        fontSize: 30,
        fill: 0x21352b,
        fontWeight: "900"
      });
      num.anchor.set(0.5);
      headWrap.addChild(num);

      const mole = {
        container: c,
        hole,
        headWrap,
        head,
        num,
        answer: 0,
        isCorrect: false,
        pop: 0,
        active: false
      };

      c.on("pointertap", () => onMoleTap(mole));
      board.addChild(c);
      return mole;
    }

    for (let i = 0; i < MOLE_COUNT; i++) {
      moles.push(makeMole());
    }

    function layout() {
      const w = app.renderer.width;
      const h = app.renderer.height;

      drawSkyAndGround(w, h);

      questionRow.removeChildren();
      const slotW = Math.min(170, Math.max(110, w / 6.5));
      const rowY = h * 0.14;
      for (let i = 0; i < 5; i++) {
        const box = new PIXI.Graphics();
        const x = w * 0.16 + i * slotW;
        const isCurrent = i === 0;
        box.lineStyle(isCurrent ? 4 : 2, isCurrent ? 0xe15b44 : 0x7fb27f, 0.9);
        box.beginFill(isCurrent ? 0xffffff : 0xf3fff1, 1);
        box.drawRoundedRect(-slotW * 0.44, -30, slotW * 0.88, 60, 14);
        box.endFill();
        box.x = x;
        box.y = rowY;
        questionRow.addChild(box);

        const label = new PIXI.Text("", {
          fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
          fontSize: isCurrent ? 30 : 24,
          fill: isCurrent ? 0x2d4034 : 0x4a6a56,
          fontWeight: "900"
        });
        label.anchor.set(0.5);
        label.x = x;
        label.y = rowY;
        label.name = `qslot_${i}`;
        questionRow.addChild(label);
      }

      const cols = 3;
      const gapX = w * 0.24;
      const baseX = w * 0.26;
      const baseY = h * 0.56;
      const gapY = h * 0.22;

      for (let i = 0; i < moles.length; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols) % 2;
        const m = moles[i];
        m.container.x = baseX + col * gapX;
        m.container.y = baseY + row * gapY;
        drawMole(m, Math.min(w, h));
      }

      feedbackText.x = w * 0.5;
      feedbackText.y = h * 0.42;

      overlayBg.clear();
      overlayBg.beginFill(0x000000, 0.55);
      overlayBg.drawRect(0, 0, w, h);
      overlayBg.endFill();
      overlayTitle.x = w * 0.5;
      overlayTitle.y = h * 0.28;
      overlayInfo.x = w * 0.5;
      overlayInfo.y = h * 0.45;
      startBtn.x = w * 0.5;
      startBtn.y = h * 0.69;
      drawStartButton(Math.min(300, w * 0.42), 74);

      updateQuestionRow();
    }

    function drawSkyAndGround(w, h) {
      const old = root.getChildByName("bg");
      if (old) root.removeChild(old);
      const g = new PIXI.Graphics();
      g.name = "bg";
      g.beginFill(0xd6efff, 0.35);
      g.drawRect(0, 0, w, h * 0.62);
      g.endFill();
      g.beginFill(0x6db45f, 0.2);
      g.drawRect(0, h * 0.62, w, h * 0.38);
      g.endFill();
      for (let i = 0; i < 8; i++) {
        const hillW = w * (0.35 + (i % 3) * 0.08);
        const x = (i / 7) * w - hillW * 0.3;
        const y = h * (0.65 + (i % 2) * 0.03);
        g.beginFill(i % 2 ? 0x86c87a : 0x7fbd74, 0.32);
        g.drawEllipse(x, y, hillW, h * 0.2);
        g.endFill();
      }
      root.addChildAt(g, 0);
    }

    function drawMole(mole, sizeBase) {
      const holeW = sizeBase * 0.17;
      const holeH = sizeBase * 0.05;
      const headR = sizeBase * 0.06;

      mole.hole.clear();
      mole.hole.beginFill(0x503828, 1);
      mole.hole.drawEllipse(0, 0, holeW, holeH);
      mole.hole.endFill();
      mole.hole.beginFill(0x2f1d14, 1);
      mole.hole.drawEllipse(0, -4, holeW * 0.88, holeH * 0.62);
      mole.hole.endFill();

      mole.head.clear();
      mole.head.lineStyle(3, 0x8f6d4d, 1);
      mole.head.beginFill(0xdcb894, 1);
      mole.head.drawCircle(0, 0, headR);
      mole.head.endFill();
      mole.head.beginFill(0x2a241f, 1);
      mole.head.drawCircle(-headR * 0.37, -headR * 0.18, headR * 0.08);
      mole.head.drawCircle(headR * 0.37, -headR * 0.18, headR * 0.08);
      mole.head.endFill();
      mole.head.beginFill(0x9f7b5c, 1);
      mole.head.drawEllipse(0, headR * 0.15, headR * 0.2, headR * 0.14);
      mole.head.endFill();

      mole.num.style.fontSize = Math.round(sizeBase * 0.05);
      mole.num.y = -headR * 1.6;
    }

    function drawStartButton(w, h) {
      startBtnBg.clear();
      startBtnBg.lineStyle(3, 0xffffff, 0.9);
      startBtnBg.beginFill(0xe15b44, 1);
      startBtnBg.drawRoundedRect(-w / 2, -h / 2, w, h, 18);
      startBtnBg.endFill();
      startBtnText.x = 0;
      startBtnText.y = 0;
    }

    function randomInt(a, b) {
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function makeQuestion() {
      const type = Math.random() < 0.55 ? "+" : "-";
      let a, b;
      if (type === "+") {
        a = randomInt(3, 30);
        b = randomInt(2, 25);
        return { text: `${a} + ${b} = ?`, answer: a + b };
      }
      a = randomInt(12, 40);
      b = randomInt(2, 22);
      if (b > a) [a, b] = [b, a];
      return { text: `${a} - ${b} = ?`, answer: a - b };
    }

    function fillQueue() {
      while (state.queue.length < 5) state.queue.push(makeQuestion());
    }

    function updateQuestionRow() {
      fillQueue();
      for (let i = 0; i < 5; i++) {
        const t = questionRow.getChildByName(`qslot_${i}`);
        if (t) t.text = state.queue[i] ? state.queue[i].text : "";
      }
    }

    function nextQuestion() {
      if (state.ended) return;

      fillQueue();
      state.currentQ = state.queue.shift();
      fillQueue();
      updateQuestionRow();

      const correct = state.currentQ.answer;
      const options = [correct];
      while (options.length < MOLE_COUNT) {
        const offset = randomInt(-12, 12);
        let wrong = correct + offset;
        if (wrong < 0) wrong = randomInt(0, 50);
        if (!options.includes(wrong)) options.push(wrong);
      }
      shuffle(options);

      let hasCorrect = false;
      for (let i = 0; i < moles.length; i++) {
        const m = moles[i];
        m.answer = options[i];
        m.isCorrect = options[i] === correct && !hasCorrect;
        if (m.isCorrect) hasCorrect = true;
        m.num.text = String(m.answer);
        m.active = true;
      }
      if (!hasCorrect) {
        moles[0].answer = correct;
        moles[0].num.text = String(correct);
        moles[0].isCorrect = true;
      }

      state.roundLeft = ROUND_SECONDS;
      state.locked = false;
      showFeedback("", 0xffffff, false);
    }

    function onMoleTap(mole) {
      if (!state.started || state.ended || state.locked || !mole.active) return;
      state.locked = true;
      state.totalAnswered += 1;

      if (mole.isCorrect) {
        state.correctCount += 1;
        state.streak += 1;
        state.maxStreak = Math.max(state.maxStreak, state.streak);
        showFeedback("答对 +1", 0xf7fff5, true);
      } else {
        state.streak = 0;
        showFeedback("答错", 0xfff0f0, true);
      }

      updateHud();
      setTimeout(() => {
        if (!state.ended) nextQuestion();
      }, 260);
    }

    function handleRoundTimeout() {
      if (state.ended || state.locked) return;
      state.locked = true;
      state.totalAnswered += 1;
      state.streak = 0;
      showFeedback("超时", 0xfff4ea, true);
      updateHud();
      setTimeout(() => {
        if (!state.ended) nextQuestion();
      }, 260);
    }

    function showFeedback(text, color, flash) {
      feedbackText.text = text;
      feedbackText.style.fill = color;
      feedbackText.alpha = text ? 1 : 0;
      if (flash) feedbackText.scale.set(1.13, 1.13);
    }

    function calcScore() {
      return state.correctCount * 10 + state.maxStreak * state.maxStreak + (state.correctCount >= 12 ? 20 : 0);
    }

    function updateHud() {
      hud.time.textContent = `剩余: ${Math.max(0, state.gameLeft).toFixed(1)}s`;
      hud.correct.textContent = `答对: ${state.correctCount}`;
      hud.streak.textContent = `连对: ${state.streak}`;
      hud.maxStreak.textContent = `最高连对: ${state.maxStreak}`;
      hud.scoreHint.textContent = `当前分: ${calcScore()}`;
    }

    function endGame() {
      state.ended = true;
      state.started = false;
      for (const m of moles) m.active = false;
      overlay.visible = true;
      overlayTitle.text = "时间到";
      overlayInfo.text =
        `答对: ${state.correctCount} 题\n` +
        `最高连对: ${state.maxStreak}\n` +
        `最终得分: ${calcScore()}`;
      startBtnText.text = "再来一局";
      updateHud();
    }

    function resetAndStart() {
      state.started = true;
      state.ended = false;
      state.gameLeft = GAME_SECONDS;
      state.roundLeft = ROUND_SECONDS;
      state.currentQ = null;
      state.queue = [];
      state.totalAnswered = 0;
      state.correctCount = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.locked = false;
      overlay.visible = false;
      feedbackText.alpha = 0;
      updateHud();
      nextQuestion();
    }

    startBtn.on("pointertap", resetAndStart);

    app.ticker.add((delta) => {
      const dt = delta / 60;

      if (feedbackText.alpha > 0) {
        feedbackText.alpha = Math.max(0, feedbackText.alpha - dt * 1.35);
        feedbackText.scale.x += (1 - feedbackText.scale.x) * 0.2;
        feedbackText.scale.y += (1 - feedbackText.scale.y) * 0.2;
      }

      for (const m of moles) {
        const target = m.active ? 1 : 0;
        m.pop += (target - m.pop) * 0.22;
        m.headWrap.y = -m.pop * (app.renderer.height * 0.11);
        m.container.alpha = 0.65 + 0.35 * m.pop;
      }

      if (!state.started || state.ended) return;

      state.gameLeft -= dt;
      state.roundLeft -= dt;

      if (state.roundLeft <= 0) handleRoundTimeout();
      if (state.gameLeft <= 0) endGame();

      updateHud();
    });

    window.addEventListener("resize", layout);

    overlay.visible = true;
    overlayTitle.text = "口算打地鼠";
    overlayInfo.text =
      "30 秒内尽量多答题\n"
      + "点击带有正确答案的地鼠\n"
      + "点错或超时都算答错";
    startBtnText.text = "开始挑战";

    updateHud();
    layout();
  </script>
</body>
</html>
